name: Build Android APK

on:
  push:
    branches: ["main", "master", "arena/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build Debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # JDK 21 is required by Robolectric 4.16 to emulate SDK 36; app bytecode stays Java 11.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -x
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          # AGP resolves the 36.1 minor platform on its own; pre-fetch it when possible.
          "$SDKMANAGER" --install "platforms;android-36.1" || true

      # This repository ships no gradle wrapper jar, so Gradle is provisioned explicitly at the
      # version pinned in gradle/wrapper/gradle-wrapper.properties.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Prepare Environment
        run: |
          touch .env

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee build-log.txt

      # Job logs are stored in blob storage, so on failure publish a short, secret-free
      # excerpt of compiler/test errors to the pull request for quick triage.
      - name: Surface build errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          PR=$(gh pr list --head "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --state open --json number --jq '.[0].number' || true)
          {
            echo "### CI failure excerpt"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (commit \`${GITHUB_SHA:0:8}\`)"
            echo ""
            echo '```'
            grep -aE '^e: |^w: .*error|error: |FAILED|Caused by:|What went wrong|Execution failed for task|expected:|actual:|Unresolved reference|> There were failing tests' build-log.txt 2>/dev/null | head -120 || echo "(no matching error lines captured)"
            echo '```'
            echo ""
            echo "_Full logs: see the run link above (Summary → Run unit tests)._"
          } > excerpt.md
          sed -i 's/^/CI :: /' /dev/null 2>/dev/null || true
          if [ -n "$PR" ]; then
            CID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("CI failure excerpt")) | .id' 2>/dev/null | tail -1 || true)
            if [ -n "$CID" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$CID" -F body=@excerpt.md > /dev/null && echo "updated comment $CID"
            else
              gh pr comment "$PR" --body-file excerpt.md > /dev/null && echo "posted excerpt to PR #$PR"
            fi
          else
            echo "no open PR for this branch; excerpt follows"
            cat excerpt.md
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 14

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Personal-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
